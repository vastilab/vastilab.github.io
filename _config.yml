# Basic
name:               "Vast Intelligence Lab"
title:              "Vast Intelligence Lab"
description:        "VastiLab builds open-source, audit-native AI research tools that help researchers move from literature to ideas, drafts, and pre-submission review."


# URL
url: https://vastilab.github.io/
baseurl: ""
#baseurl:            "" #For Root Domain
permalink:          /:year/:month/:day/:title.html

# Markdown
markdown:           kramdown

# Highlighter
highlighter:        rouge

# Navigation
nav:
  - name:           "home"
    href:           "/"
  - name:           "people"
    href:           "/people"
  - name:           "projects"
    href:           "/projects"
  #- name:           "resources"
  #  href:           "/resources"
  #- name:           "news"
    #href:           "/news"

# Sass
sass:
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"
  -
    scope:
      path:         ""
      type:         "people"
    values:
      layout:       "profile"


collections:
  people:
    output: true
    permalink: /people/:title/index.html
